name: Build
on:
  workflow_call
jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Create Code Signing Certificate
      run : |
        New-Item -ItemType directory -Path certificate
        Set-Content -Path certificate\certificate.txt -Value '${{ secrets.CERTIFICATE }}'
        certutil -decode certificate\certificate.txt certificate\certificate.pfx
    - name: Install dotnet-coverage
      run: dotnet tool install --global dotnet-coverage
    - name: Build
      run: dotnet build --no-restore --configuration Debug
    - name: Test
      # Interop tests shell out to gpg and run on the dedicated Linux job (see build-on-pr.yml);
      # the Windows runner's MSYS gpg mishandles Windows --homedir paths and has no gpg-agent.
      run: dotnet-coverage collect "dotnet test --no-build --verbosity normal --filter Category!=Interop" -f xml -o "coverage.xml"
    - name: Ouput Test Coverage Artifact
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: coverage.xml