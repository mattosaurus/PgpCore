name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    uses: ./.github/workflows/build.yml
  analyze:
    needs: build
    # Fork PRs don't receive repository secrets (SONAR_TOKEN), so the scan can't run there;
    # contributions are analyzed on the push to master after merge instead.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/analyze.yml
    secrets: inherit
  interop:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Show gpg version
      run: gpg --version
    - name: Run gpg interop tests
      run: dotnet test --project PgpCore.Tests/PgpCore.Tests.csproj --filter "Category=Interop" --output Detailed